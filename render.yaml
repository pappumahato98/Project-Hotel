# ─── Render Deploy Configuration ─────────────────────────────
#
# DEPLOY OPTIONS:
#
# Option A — Blueprint (1-Click):
#   1. https://dashboard.render.com/blueprints → New Blueprint Instance
#   2. Connect repo: pappumahato98/Project-Neo
#   3. Render auto-reads this file
#   4. Add env vars (DATABASE_URL, JWT_SECRET)
#   5. Apply
#
# Option B — Manual Web Service:
#   1. https://dashboard.render.com → New → Web Service
#   2. Connect repo: pappumahato98/Project-Neo
#   3. Build Command:  npm run build  (prisma generate + next build, NO DB needed)
#   4. Start Command:  npm start  (runs migrations best-effort, then next start)
#   5. Add env vars → Deploy
#
# REQUIRED ENV VARIABLES (set in Render dashboard):
#
#   DATABASE_URL  = Transaction pooler URL (for runtime queries)
#                  postgresql://postgres.[ref]:[pass]@pooler.supabase.com:5432/postgres?pgbouncer=true
#   DIRECT_DATABASE_URL = Session mode URL (for migrations only, OPTIONAL)
#                  If set, used automatically during start for prisma migrate deploy
#                  If not set, start command auto-switches pooler port 5432 → 6543
#                  postgresql://postgres.[ref]:[pass]@pooler.supabase.com:6543/postgres
#   JWT_SECRET    = <64+ char random string>
#   REDIS_URL     = Redis connection string (OPTIONAL — falls back to in-memory)
#                  Format: rediss://default:pass@redis-host:port (TLS in prod)
#
# NOTE: Build does NOT require a database connection.
#       Migrations run at startup (best-effort, won't crash if DB is unavailable).
#       If DB is not set up yet, use POST /api/db-setup after first deploy.
#
# AFTER FIRST DEPLOY:
#   POST /api/db-setup  to seed default users & chart of accounts
# ─────────────────────────────────────────────────────────────

services:
  - type: web
    name: meridian-pms
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
    healthCheckPath: /api/health
    region: singapore
