# ─── Render 1-Click Deploy Configuration ───────────────────────────
#
# HOW TO DEPLOY (2 options):
#
# Option A — 1-Click Deploy (Blueprint):
#   1. Go to https://dashboard.render.com/blueprints
#   2. Click "New Blueprint Instance"
#   3. Connect repo: pappumahato98/Project-Neo
#   4. Render reads this file automatically
#   5. Add your 2 environment variables (see below)
#   6. Click "Apply" — done!
#
# Option B — Manual:
#   1. Go to https://dashboard.render.com → New → Web Service
#   2. Connect repo: pappumahato98/Project-Neo
#   3. Build Command: npx prisma generate && npx next build
#   4. Start Command: npx next start -H 0.0.0.0 -p $PORT
#   5. Add env vars → Deploy
#
# REQUIRED ENV VARIABLES (set in Render dashboard):
#
#   DATABASE_URL = postgresql://postgres.[ref]:[pass]@aws-0-[region].pooler.supabase.com:5432/postgres?pgbouncer=true&connection_limit=7&connect_timeout=15&pool_timeout=15
#   JWT_SECRET  = <64+ char random string>
#
#   Generate JWT_SECRET:
#     node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
#
# ─────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: meridian-pms
    runtime: node
    plan: starter # $7/mo — always-on, no cold starts
    buildCommand: npx prisma generate && npx next build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    envVars:
      # ── Database (Supabase PostgreSQL) ─────────────────────────────
      # Transaction pooler URL with PgBouncer params
      - key: DATABASE_URL
        sync: false
      # ── JWT Auth ────────────────────────────────────────────────────
      # 64+ char random string for signing access tokens
      - key: JWT_SECRET
        sync: false
      # ── Next.js ────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: "0.0.0.0"
    region: singapore # Closest to Nepal — lowest latency
