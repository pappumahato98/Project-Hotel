# ─── Render Deploy Configuration ─────────────────────────────
#
# DEPLOY OPTIONS:
#
# Option A — Blueprint (1-Click):
#   1. https://dashboard.render.com/blueprints → New Blueprint Instance
#   2. Connect repo: pappumahato98/Project-Neo
#   3. Render auto-reads this file
#   4. Add env vars (DATABASE_URL, JWT_SECRET)
#   5. Apply
#
# Option B — Manual Web Service:
#   1. https://dashboard.render.com → New → Web Service
#   2. Connect repo: pappumahto98/Project-Neo
#   3. Build Command:  see buildCommand below
#   4. Start Command: npm start  (uses PORT from package.json)
#   5. Add env vars → Deploy
#
# REQUIRED ENV VARIABLES (set in Render dashboard):
#
#   DATABASE_URL  = PostgreSQL connection string
#                  For Supabase, use the TRANSACTION-MODE pooler URL:
#                  postgresql://postgres.[ref]:[pass]@pooler.supabase.com:5432/postgres?pgbouncer=true
#                  (Build command auto-switches to session-mode for migrations)
#   JWT_SECRET    = <64+ char random string>
#
# MIGRATION STRATEGY:
#   Schema changes are managed via `prisma migrate` (version-controlled SQL files).
#   - prisma/migrations/0_baseline/migration.sql = initial schema (already applied)
#   - Future changes: `npx prisma migrate dev --name description`
#   - Deploy: `npx prisma migrate deploy` applies only new migrations
#   - Fallback: /api/db-setup still available for runtime schema sync
#
# AFTER FIRST DEPLOY:
#   POST /api/db-setup  to seed default users & chart of accounts
# ─────────────────────────────────────────────────────────────

services:
  - type: web
    name: meridian-pms
    runtime: node
    plan: starter
    buildCommand: |
      set -e
      echo "=== Build starting ==="
      echo "Node: $(node -v) | npm: $(npm -v)"

      # ── Step 1: Apply database migrations ──
      if [ -n "$DATABASE_URL" ]; then
        MIGRATE_URL="$DATABASE_URL"
        # Supabase pooler port 5432 = transaction mode (bad for DDL/migrations)
        # Switch to session-mode port 6543 for prisma migrate deploy
        if echo "$MIGRATE_URL" | grep -q 'pooler\.supabase\.com:5432'; then
          MIGRATE_URL=$(echo "$MIGRATE_URL" | sed 's|pooler\.supabase\.com:5432|pooler.supabase.com:6543|' | sed 's|[?&]pgbouncer=true||g' | sed 's|&|?|1' | sed 's|?$||')
          echo "[migrate] Detected Supabase PgBouncer — using session-mode port 6543"
        fi

        echo "[migrate] Running prisma migrate deploy..."
        DATABASE_URL="$MIGRATE_URL" npx prisma migrate deploy 2>&1 || {
          echo "[warn] prisma migrate deploy failed — attempting fallback with db push"
          DATABASE_URL="$MIGRATE_URL" npx prisma db push --accept-data-loss 2>&1 || {
            echo "[warn] prisma db push also failed (non-fatal, /api/db-setup can sync later)"
          }
        }
      else
        echo "[migrate] DATABASE_URL not set — skipping migrations"
      fi

      # ── Step 2: Generate Prisma client ──
      echo "[prisma] Generating client..."
      npx prisma generate

      # ── Step 3: Next.js build ──
      echo "[next] Building..."
      npx next build

      echo "=== Build complete ==="
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
    healthCheckPath: /api/health
    region: singapore
