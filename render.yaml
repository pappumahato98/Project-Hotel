# ─── Render 1-Click Deploy Configuration ───────────────────────────
#
# HOW TO DEPLOY (2 options):
#
# Option A — 1-Click Deploy (Blueprint):
#   1. Go to https://dashboard.render.com/blueprints
#   2. Click "New Blueprint Instance"
#   3. Connect repo: pappumahato98/Project-Neo
#   4. Render reads this file automatically
#   5. Add your environment variables (see below)
#   6. Click "Apply" — done!
#
# Option B — Manual:
#   1. Go to https://dashboard.render.com → New → Web Service
#   2. Connect repo: pappumahato98/Project-Neo
#   3. Build Command (copy from below)
#   4. Start Command: npx next start -H 0.0.0.0 -p $PORT
#   5. Add env vars → Deploy
#
# REQUIRED ENV VARIABLES (set in Render dashboard):
#
#   DATABASE_URL  = PostgreSQL connection string
#   JWT_SECRET    = <64+ char random string>
#
# FALLBACK: If schema gets out of date after deployment, visit:
#   POST /api/db-setup  (with {"token":"your-jwt-secret"}) to sync schema
# ─────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: meridian-pms
    runtime: node
    plan: starter
    buildCommand: |
      # For Supabase PgBouncer: convert transaction-mode (5432) → session-mode (6543) for DDL
      # For Render/standard PostgreSQL: this is a no-op (URL unchanged)
      MIGRATE_URL="${DATABASE_URL}"
      if echo "$MIGRATE_URL" | grep -q 'pooler\.supabase\.com:5432'; then
        MIGRATE_URL=$(echo "$MIGRATE_URL" | sed 's|pooler\.supabase\.com:5432|pooler.supabase.com:6543|' | sed 's|[?&]pgbouncer=true||g' | sed 's|&|?|1' | sed 's|?$||')
        echo "[build] Detected Supabase PgBouncer — using session-mode URL for migrations"
      fi
      DATABASE_URL="$MIGRATE_URL" npx prisma db push --accept-data-loss 2>&1
      npx prisma generate && npx next build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
    healthCheckPath: /api/health
    region: singapore
